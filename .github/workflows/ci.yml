name: CI

on:
  push:
    branches: [main, next]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Composer 2.9+ refuses to install versions with security advisories, abandoned
  # packages and (2.11+) releases still in their cooldown period. CI must install
  # every version composer.json supports, so CI turns that blocking off.
  # COMPOSER_NO_BLOCKING is the 2.11+ name; COMPOSER_NO_SECURITY_BLOCKING covers
  # 2.9 and 2.10.
  COMPOSER_NO_BLOCKING: 1
  COMPOSER_NO_SECURITY_BLOCKING: 1

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            symfony: '6.4.*'
          - php: '8.2'
            symfony: '7.4.*'
          # Symfony 8.0 is out of maintenance, and every 8.0 release has open security
          # advisories, so the composer audit step below would fail on it.
          - php: '8.4'
            symfony: '8.1.*'
          - php: '8.5'
            symfony: '8.1.*'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Install selected Symfony version
        run: >-
          composer update
          --with='symfony/mailer:${{ matrix.symfony }}'
          --with='symfony/mime:${{ matrix.symfony }}'
          --with='symfony/http-client:${{ matrix.symfony }}'
          --with='symfony/dependency-injection:${{ matrix.symfony }}'
          --with='symfony/config:${{ matrix.symfony }}'
          --with='symfony/yaml:${{ matrix.symfony }}'
          --with='symfony/event-dispatcher:${{ matrix.symfony }}'
          --with-all-dependencies --no-interaction --prefer-dist
      - run: composer test
      - run: composer analyse
      - run: composer format-check
      - run: composer audit
      - run: php examples/standalone.php

      - name: Build package
        run: composer archive --format=zip --dir=artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: package-php-${{ matrix.php }}-symfony-${{ strategy.job-index }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 7

  # The one check branch protection requires. It fails when a job above failed or
  # was cancelled; skipped jobs count as passed.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [test]
    runs-on: ubuntu-slim
    steps:
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
