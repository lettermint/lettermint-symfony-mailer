name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release package
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/check_release.py
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Build package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          export COMPOSER_ROOT_VERSION="${RELEASE_TAG#v}"
          composer archive --format=zip --dir=artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: release-package
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  changelog:
    needs: build
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-changelog.yml

  discord:
    needs: build
    uses: ./.github/workflows/release-to-discord.yml
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
