name: Release to Discord

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check webhook configuration
        id: webhook
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Send release notification
        if: steps.webhook.outputs.configured == 'true'
        uses: lettermint/action-discord-releases@v1.0.1
        with:
          color: '8892BE'
          webhook_url: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          content: 'A new release for the Lettermint Symfony Mailer bridge is now available!'
